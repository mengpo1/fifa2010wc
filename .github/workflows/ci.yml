# Linux CI for the checks that run without the game (milestone J1).
# No step reads, downloads or produces game data. Hosted runners have no GPU, so the Vulkan
# probe is informational only (docs/reports/J1_VALIDATION.md, tests not runnable here).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Proprietary data check (tracked files)
        run: |
          python3 -I tools/test_check_proprietary_data.py
          python3 -I tools/check_proprietary_data.py repo

      # cachix/install-nix-action v32.0.0, with the Nix release used for J1 (2.34.6)
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.6/install

      - name: Flake inputs match flake.lock
        run: nix flake metadata --no-update-lock-file

      - name: nix flake check (SDK from source with its tests, CLI run, CMake skeleton, data checks)
        run: nix flake check -L --no-update-lock-file

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          nix build .#rexglue-sdk --no-update-lock-file --out-link result-sdk \
            && cp -r result-sdk/share/rexglue-sdk/test-results evidence/sdk-test-results || true
          for c in rexglue-cli-runs cmake-skeleton a7-synthetic-chain proprietary-data-source proprietary-data-closure iso-identify-selftest b1-extract-selftest; do
            nix build ".#checks.x86_64-linux.$c" --no-update-lock-file --out-link "result-$c" \
              && cp -r "result-$c" "evidence/$c" || true
          done

      - name: Vulkan probe (informational, hosted runners have no GPU)
        if: always()
        run: |
          set +e
          nix run .#vulkan-probe --no-update-lock-file | tee evidence/vulkan-probe.txt
          echo "probe exit status: ${PIPESTATUS[0]}" | tee -a evidence/vulkan-probe.txt
          exit 0

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: j1-evidence
          path: evidence/
          if-no-files-found: warn
